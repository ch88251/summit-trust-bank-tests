name: summit-trust-bank
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: cfhayes/summit-trust-bank:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bank:bank@db:5432/bank
      SECRET_KEY: ${SECRET_KEY:-local-test-secret}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-60}
      # Exposes POST /api/test/reset, which the test suite uses to restore seed data.
      ENABLE_TEST_ENDPOINTS: "true"
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

volumes:
  pgdata:
